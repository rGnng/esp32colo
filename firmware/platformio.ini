; ColoPLAY (ESP32-S3-WROOM-1-N16R8) bring-up firmware
;
; First-stage firmware: WiFi + web status page + OTA.  It deliberately does
; not touch the unknown display/audio wiring, so it is safe to flash as a
; connectivity test.  See README.md for backup/flash instructions.

[env:coloplay]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module: 16 MB QIO flash, 8 MB Octal PSRAM (PSRAM unused for now)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Native USB (GPIO19/20) is wired to the ESP32-S3 USB-Serial/JTAG peripheral.
; Route Serial to it so logs remain visible over the same USB-C cable.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed = 460800

; Keep the build output local to the project.
build_dir = .pio/build
