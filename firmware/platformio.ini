; ColoPLAY (ESP32-S3-WROOM-1-N16R8) bring-up firmware
;
; First-stage firmware: WiFi + web status page + OTA.  It deliberately does
; not touch the unknown display/audio wiring, so it is safe to flash as a
; connectivity test.  See README.md for backup/flash instructions.

[env:coloplay]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module: 16 MB QIO flash, 8 MB Octal PSRAM.
; The memory_type must select OPI PSRAM; the default dio_qspi config tries
; to initialise quad PSRAM and hangs before the application starts.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Match the factory bootloader's layout. The factory bootloader and its
; partition table at 0x10000 stay in place; the same table is copied to
; 0x8000 so the Arduino application (which reads 0x8000) sees it too.
board_build.partitions = partitions_coloplay.csv

; Native USB (GPIO19/20) is wired to the ESP32-S3 USB-Serial/JTAG peripheral.
; Route Serial to it so logs remain visible over the same USB-C cable.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed = 460800

; Keep the build output local to the project.
build_dir = .pio/build
