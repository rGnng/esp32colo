; ColoPLAY hardware demo. Upload the application only; keep the factory
; bootloader and both partition-table copies. See docs/flash.md.

[platformio]
build_dir = .pio/build

[env:coloplay]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module: 16 MB QIO flash, 8 MB Octal PSRAM.
; The memory_type must select OPI PSRAM; the default dio_qspi config tries
; to initialise quad PSRAM and hangs before the application starts.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; Match the factory bootloader's layout. The factory bootloader and its
; partition table at 0x10000 stay in place; the same table is copied to
; 0x8000 so the Arduino application (which reads 0x8000) sees it too.
board_build.partitions = partitions_coloplay.csv

; Native USB (GPIO19/20) is wired to the ESP32-S3 USB-Serial/JTAG peripheral.
; Route Serial to it so logs remain visible over the same USB-C cable.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    ; TFT_eSPI 2.5.43 otherwise uses Arduino FSPI=0 as an IDF register index.
    ; On S3 that makes SPI_USER_REG resolve to 0x10 and crashes at init().
    -DUSE_FSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_MISO=-1
    -DTFT_SCLK=14
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=45
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit NeoPixel@1.12.3

monitor_speed = 115200
upload_speed = 460800
