<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColoPlay · Firmware</title><link rel="icon" type="image/svg+xml" href="{{PROJECT_ICON}}"><link rel="stylesheet" href="{{BOOTSTRAP_CSS}}"><link rel="stylesheet" href="{{APP_CSS}}"></head><body class="update-page"><section><h1>Firmware update</h1><p>Select the application firmware.bin.</p><form id="upload"><label for="firmware-file">Application image</label><input class="form-control form-control-sm" id="firmware-file" name="firmware" type="file" accept=".bin" required><button class="btn btn-sm btn-primary">Upload and restart</button></form><progress id="progress" max="100" value="0"></progress><p id="result" role="status"></p><a href="/">Back to settings</a></section><script>document.getElementById('upload').onsubmit=e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const x=new XMLHttpRequest();x.open('POST','/update');x.upload.onprogress=p=>{if(p.lengthComputable)document.getElementById('progress').value=p.loaded/p.total*100};x.onload=()=>{document.getElementById('result').textContent=x.status===200?'Upload complete. Restarting…':x.responseText;b.disabled=false};x.onerror=()=>{document.getElementById('result').textContent='Connection lost. Check device status before retrying.';b.disabled=false};x.send(new FormData(e.target))}</script></body></html>
